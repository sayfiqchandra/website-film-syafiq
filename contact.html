<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenenema</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        text-decoration: none;
      }

      body {
        background-color: rgba(134, 6, 6, 0.882);
        color: aliceblue;
      }

      /* Banner */
      .banner {
        position: relative;
        top: 0;
        width: 100%;
        z-index: 10;
        overflow: hidden;
      }

      .banner-img {
        width: 100%;
        height: 200px;
        display: block;
        object-fit: cover;
      }

      .banner-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: white;
        width: 100%;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }

      .banner-text h1 {
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        font-family: "Times New Roman", Times, serif;
      }

      /* Navbar */

      /* Content */
      .contact {
        padding: 5rem 7% 1.4rem;
        background-image: linear-gradient(
            rgba(134, 6, 6, 0.8),
            rgba(134, 6, 6, 0.8)
          ),
          url("img/pop.jfif");
        background-size: cover;
        background-position: center;
      }

      .contact .row {
        display: flex;
        flex-direction: column;
        margin-top: 1rem;
        background-color: rgb(77, 76, 76);

        /* PENGATURAN UKURAN */
        max-width: 800px; /* Batas lebar kotak abu-abu */
        margin-left: auto; /* Pusatkan ke tengah */
        margin-right: auto; /* Pusatkan ke tengah */
        border-radius: 10px; /* Opsional: agar sudut kotak lebih halus */
        overflow: hidden; /* Agar konten di dalam tidak keluar dari kotak */
      }

      .contact h2 {
        margin-bottom: 3rem;
        text-align: center;
        color: yellow;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 3rem;
      }

      .contact p {
        margin: 1.4rem auto 1.4rem;
        font-size: 1.4rem;
        font-weight: 10;
        line-height: 1.6;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        max-width: 50%;
        color: rgb(231, 234, 234);
      }

      .contact .row form {
        display: flex;
        flex-direction: column;
        align-items: center; /* Ini yang akan menarik semua kotak input ke tengah */

        padding: 5rem 2rem;
        width: 100%;
      }

      .contact .row form .input-group {
        display: flex;
        align-items: center;
        margin-top: 2rem;
        background-color: black;
        border: 1px solid white;
        padding: auto;
      }

      .contact .row form .input-group input {
        width: 100%;
        padding: 2rem;
        font-size: 1.7rem;
        background: none;
        color: wheat;
      }

      .contact .row form .btn {
        margin-top: 3rem;
        display: inline-block;
        padding: 1rem 3rem;
        font-size: 1.7rem;
        color: wheat;
        background-color: cadetblue;
        cursor: pointer;
      }

      /* Footer */
      .footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 10px;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <header class="banner" id="home">
      <img src="img/headhero.jpg" alt="Banner Scenema" class="banner-img" />
      <div class="banner-text">
        <h1>SCENEMA</h1>
      </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">scene<span>ma</span>.</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">ABOUT</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">GALLERY</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">CONTACT</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="contact" id="contact">
      <h2>Contact Us</h2>
      <p>
        Kalian bisa memberikan saran, kritik pada kami. Silahkan isi form
        tersebut agar kami dapat merespon anda
      </p>

      <div class="row">
        <form>
          <div class="input-group">
            <input type="text" placeholder="nama" />
          </div>
          <div class="input-group">
            <input type="text" placeholder="nomor telepon" />
          </div>
          <div class="input-group">
            <input type="text" placeholder="email" />
          </div>

          <button type="submit" class="btn">kirim</button>
        </form>
      </div>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Syafiq Chandra Muzaki, NIM: 251011700111, 01SIFP002</p>
      <div id="time"></div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
