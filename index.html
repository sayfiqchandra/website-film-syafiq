<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenema</title>

    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        text-decoration: none;
      }

      body {
        color: aliceblue;
        background-image: linear-gradient(
            rgba(134, 6, 6, 0.8),
            rgba(134, 6, 6, 0.8)
          ),
          url("img/pop.jfif");
        background-size: cover;
      }

      /* Jarak agar section tidak tertutup navbar saat diklik */
      section {
        scroll-margin-top: 100px;
      }

      /* Banner */
      .banner {
        position: relative;
        width: 100%;
        overflow: hidden;
        top: 0;
        z-index: 10;
      }

      .banner-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }

      .banner-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }

      .banner-text h1 {
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        font-family: "Times New Roman", Times, serif;
      }

      /* Navbar */

      /* Hero & Carousel */
      .hero {
        min-height: 80vh;
        display: flex;
        align-items: center;
        padding: 60px 0;
      }

      .carousel-img {
        height: 400px;
        object-fit: cover;
        border-radius: 20px;
      }

      /* Footer */
      .footer {
        background-color: #1a1a1a;
        color: white;
        text-align: center;
        padding: 20px;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <header class="banner" id="home">
      <img src="img/headhero.jpg" alt="Banner Scenema" class="banner-img" />
      <div class="banner-text">
        <h1>SCENEMA</h1>
      </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">scene<span>ma</span>.</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">ABOUT</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">GALLERY</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">CONTACT</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero container">
      <div class="row align-items-center">
        <div class="col-lg-5 mb-5 mb-lg-0">
          <h1 class="display-4 fw-bold mb-3">
            Menonton dengan damai dan tenang hanya di
            <span class="text-warning">scenema</span>
          </h1>
          <p class="lead mb-4">
            Kamu mau nonton dengan gratis dan juga kualitas video yang full HD
            langsung aja ke sini.
          </p>
          <a href="gallery.html" class="btn btn-outline-light btn-lg px-4"
            >Selengkapnya</a
          >
        </div>

        <div class="col-lg-7">
          <div
            id="heroCarousel"
            class="carousel slide shadow-lg"
            data-bs-ride="carousel"
            data-bs-interval="2000"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="img/time.jpg"
                  class="d-block w-100 carousel-img"
                  alt="Movie 1"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="img/usual.jpg"
                  class="d-block w-100 carousel-img"
                  alt="Movie 2"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="img/sunrise.jpg"
                  class="d-block w-100 carousel-img"
                  alt="Movie 3"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Syafiq Chandra Muzaki, NIM: 251011700111, 01SIFP002</p>
      <div id="jam"></div>
      <script src="js/script.js"></script>
    </footer>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
